<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon-64.png">
<title>EAGLE-OS · Internet speed test</title>
<style>
  :root { --panel:#1b1b1b; --grey:#3a3a3a; --text:#d6d6d6; --dim:#8a8a8a; --orange:#ff7a00; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#000; color:var(--text); font-family:"Noto Sans","DejaVu Sans",sans-serif; }
  main { max-width:980px; margin:0 auto; padding:36px 24px 60px; }
  h1 { margin:0; font-size:26px; color:#fff; }
  h1 span { color:var(--orange); }
  .rule { width:120px; height:4px; background:var(--orange); margin:12px 0 26px; }
  section { background:var(--panel); border:1px solid var(--grey); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
  h2 { margin:0 0 4px; font-size:17px; color:#fff; }
  .note { color:var(--dim); font-size:13px; margin:0 0 14px; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  button, a.btn { font:inherit; font-size:15px; font-weight:700; padding:12px 20px; border-radius:10px; border:0; cursor:pointer; text-decoration:none; }
  .primary { background:var(--orange); color:#000; }
  .secondary { background:var(--grey); color:#fff; }

  .meter { display:flex; flex-direction:column; align-items:center; gap:6px; padding:8px 0 4px; }
  #gauge { width:min(360px, 80vw); }
  #gauge .track { fill:none; stroke:#2a2a2a; stroke-width:16; stroke-linecap:round; }
  #gauge .val { fill:none; stroke:var(--orange); stroke-width:16; stroke-linecap:round; transition:stroke-dashoffset .25s; }
  #gauge text { fill:#fff; text-anchor:middle; }
  #gauge .big { font-size:46px; font-weight:800; }
  #gauge .unit { font-size:15px; fill:var(--dim); }
  #phase { color:var(--dim); font-size:15px; min-height:20px; }
  .results { display:grid; grid-template-columns:repeat(4, 1fr); gap:12px; margin-top:16px; }
  @media (max-width:700px) { .results { grid-template-columns:1fr 1fr; } }
  .res { background:#111; border:1px solid var(--grey); border-radius:12px; padding:14px; text-align:center; }
  .res .k { color:var(--dim); font-size:12px; letter-spacing:.1em; text-transform:uppercase; }
  .res .v { color:#fff; font-size:26px; font-weight:800; margin-top:4px; }
  .res .v small { font-size:13px; color:var(--dim); font-weight:400; }
  .res.on { border-color:var(--orange); }
  #where { color:var(--dim); font-size:13px; text-align:center; margin-top:12px; min-height:18px; }
  #verdict { color:var(--text); font-size:15px; text-align:center; margin-top:8px; min-height:20px; }
  .actions.center { justify-content:center; margin-top:16px; }
</style>
</head>
<body>
<main>
  <h1>Internet speed test <span>EAGLE-OS</span></h1>
  <div class="rule"></div>
  <section>
    <div class="meter">
      <svg id="gauge" viewBox="0 0 300 190" role="img" aria-label="Speed">
        <path class="track" d="M 30 160 A 120 120 0 0 1 270 160"/>
        <path class="val" id="arc" d="M 30 160 A 120 120 0 0 1 270 160"/>
        <text class="big" id="num" x="150" y="140">–</text>
        <text class="unit" x="150" y="168">Mbps</text>
      </svg>
      <div id="phase">Press Start to test this connection.</div>
    </div>
    <div class="results">
      <div class="res" id="r-down"><div class="k">Download</div><div class="v" id="v-down">–</div></div>
      <div class="res" id="r-up"><div class="k">Upload</div><div class="v" id="v-up">–</div></div>
      <div class="res" id="r-ping"><div class="k">Ping</div><div class="v" id="v-ping">–</div></div>
      <div class="res" id="r-jit"><div class="k">Jitter</div><div class="v" id="v-jit">–</div></div>
    </div>
    <div id="verdict"></div>
    <div id="where"></div>
    <div class="actions center"><button type="button" class="primary" id="go">Start</button></div>
    <p class="note" style="margin:16px 0 0;text-align:center">Uses Cloudflare's speed test servers. A test uses about 100–300 MB of data.</p>
  </section>
  <div class="actions"><a class="btn secondary" href="tools.html">Back to Tools</a></div>
</main>
<script src="shim.js"></script>
<script src="activity.js"></script>
<script src="theme.js"></script>
<script src="speedtest.js"></script>
</body>
</html>
