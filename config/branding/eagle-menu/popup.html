<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; width:260px; background:#111; color:#d6d6d6; font: 14px "Noto Sans","DejaVu Sans",sans-serif; }
  header { padding:12px 14px 8px; border-bottom:3px solid #ff7a00; font-weight:800; letter-spacing:.06em; color:#e8e8e8; }
  header small { display:block; font-weight:400; letter-spacing:0; color:#8a8a8a; font-size:11px; margin-top:2px; }
  .list { padding:6px; }
  button { display:block; width:100%; text-align:left; padding:10px 12px; margin:2px 0; border:0; border-radius:6px;
           background:transparent; color:#d6d6d6; font:inherit; cursor:pointer; }
  button:hover, button:focus { background:#2a2a2a; color:#fff; outline:none; }
  button.install { background:#ff7a00; color:#000; font-weight:700; margin-top:6px; }
  button.install:hover, button.install:focus { background:#ff9330; color:#000; }
  hr { border:0; border-top:1px solid #333; margin:6px 0; }
  .hidden { display:none; }
</style>
</head>
<body>
  <header>EAGLE-OS<small>by Stumpf Technology</small></header>
  <div class="list">
    <button data-action="wifi">Wi-Fi and network</button>
    <button data-action="display">Display and screen size</button>
    <button data-action="sound">Sound</button>
    <button data-action="camera">Camera test</button>
    <button data-action="updates">Updates</button>
    <button data-action="install" id="install" class="install hidden">Install EAGLE-OS on this PC</button>
    <hr>
    <button data-action="restart">Restart</button>
    <button data-action="shutdown">Shut down</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
