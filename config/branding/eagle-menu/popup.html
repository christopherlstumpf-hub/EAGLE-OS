<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin:0; width:260px; background:#111; color:#d6d6d6; font: 14px "Noto Sans","DejaVu Sans",sans-serif; }
  header { padding:10px 14px 7px; border-bottom:3px solid var(--orange, #ff7a00); font-weight:800; letter-spacing:.06em; color:#e8e8e8; }
  header small { display:block; font-weight:400; letter-spacing:0; color:#8a8a8a; font-size:11px; margin-top:2px; }
  .list { padding:4px 6px; }
  button { display:block; width:100%; text-align:left; padding:5px 12px; margin:0; border:0; border-radius:6px;
           background:transparent; color:#d6d6d6; font:inherit; cursor:pointer; }
  button:hover, button:focus { background:#2a2a2a; color:#fff; outline:none; }
  button.install { background:var(--orange, #ff7a00); color:#000; font-weight:700; margin-top:6px; }
  button.install:hover, button.install:focus { background:var(--orange-hover, #ff9330); color:#000; }
  hr { border:0; border-top:1px solid #333; margin:4px 0; }
  .hidden { display:none; }
  #batt { color:#d6d6d6; font-size:12px; margin-top:6px; }
  #batt.low { color:#ff6b61; font-weight:700; }
</style>
</head>
<body>
  <header>EAGLE-OS<small>by Stumpf Technology</small><small id="batt" class="hidden"></small></header>
  <div class="list">
    <button data-action="wifi">Wi-Fi and network</button>
    <button data-action="display">Display and screen size</button>
    <button data-action="sound">Sound</button>
    <button data-action="datetime">Date and time</button>
    <button data-action="browser" id="browser-btn" class="hidden">Web browser</button>
    <button data-action="printers">Printers</button>
    <button data-action="links">Link tabs</button>
    <button data-action="colors">Colour scheme</button>
    <button data-action="screensaver">Screen timeout and screensaver</button>
    <button data-action="camera">Camera test</button>
    <button data-action="security">Security (antivirus)</button>
    <button data-action="disks">Disks and partitions (GParted)</button>
    <button data-action="updates">Updates</button>
    <button data-action="install" id="install" class="install hidden">Install EAGLE-OS on this PC</button>
    <hr>
    <button data-action="restart">Restart</button>
    <button data-action="shutdown">Shut down</button>
  </div>
  <script src="shim.js"></script>
  <script src="theme.js"></script>
  <script src="popup.js"></script>
</body>
</html>
