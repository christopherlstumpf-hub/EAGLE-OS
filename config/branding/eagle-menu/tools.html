<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon-64.png">
<title>EAGLE-OS · Tools</title>
<style>
  :root { --panel:#1b1b1b; --grey:#3a3a3a; --text:#d6d6d6; --dim:#8a8a8a; --orange:#ff7a00; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#000; color:var(--text); font-family:"Noto Sans","DejaVu Sans",sans-serif; }
  main { max-width:980px; margin:0 auto; padding:36px 24px 60px; }
  h1 { margin:0; font-size:26px; color:#fff; }
  h1 span { color:var(--orange); }
  .rule { width:120px; height:4px; background:var(--orange); margin:12px 0 26px; }
  section { background:var(--panel); border:1px solid var(--grey); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
  h2 { margin:0 0 4px; font-size:17px; color:#fff; }
  .note { color:var(--dim); font-size:13px; margin:0 0 14px; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  button, a.btn { font:inherit; font-size:15px; font-weight:700; padding:12px 20px; border-radius:10px; border:0; cursor:pointer; text-decoration:none; }
  .primary { background:var(--orange); color:#000; }
  .secondary { background:var(--grey); color:#fff; }

  .tools { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:14px; }
  .tool { display:flex; gap:14px; align-items:flex-start; background:#111; border:1px solid var(--grey); border-radius:12px; padding:16px; cursor:pointer; color:inherit; text-decoration:none; text-align:left; font:inherit; }
  .tool:hover, .tool:focus { border-color:var(--orange); outline:none; }
  .tool .ic { width:44px; height:44px; border-radius:12px; background:var(--orange); color:#000; display:grid; place-items:center; font-size:22px; flex:none; }
  .tool .nm { color:#fff; font-weight:700; font-size:16px; }
  .tool .ds { color:var(--dim); font-size:13px; margin-top:3px; font-weight:400; }
</style>
</head>
<body>
<main>
  <h1>Tools <span>EAGLE-OS</span></h1>
  <div class="rule"></div>
  <section>
    <div class="tools">
      <a class="tool" href="speedtest.html"><span class="ic">⚡</span><span><span class="nm">Internet speed test</span><span class="ds" style="display:block">Download, upload and ping for this Wi-Fi or network.</span></span></a>
      <a class="tool" href="camera.html"><span class="ic">📷</span><span><span class="nm">Camera test</span><span class="ds" style="display:block">See the camera picture and check the microphone.</span></span></a>
      <button type="button" class="tool" data-screen="disks"><span class="ic">💾</span><span><span class="nm">Disks and partitions</span><span class="ds" style="display:block">GParted: format a USB stick or SD card, or look at drives.</span></span></button>
    </div>
  </section>
  <div class="actions"><a class="btn secondary" href="start.html">Back to the EAGLE tab</a></div>
</main>
<script src="shim.js"></script>
<script src="activity.js"></script>
<script src="theme.js"></script>
<script src="tools.js"></script>
</body>
</html>
