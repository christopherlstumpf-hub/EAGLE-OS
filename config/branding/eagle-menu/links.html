<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon-64.png">
<title>EAGLE-OS · Link tabs</title>
<style>
  :root { --panel:#1b1b1b; --grey:#3a3a3a; --text:#d6d6d6; --dim:#8a8a8a; --orange:#ff7a00; }
  * { box-sizing:border-box; }
  html,body { margin:0; min-height:100%; background:#000; color:var(--text); font-family:"Noto Sans","DejaVu Sans",sans-serif; }
  main { max-width:980px; margin:0 auto; padding:36px 24px 60px; }
  h1 { margin:0; font-size:26px; color:#fff; }
  h1 span { color:var(--orange); }
  .rule { width:120px; height:4px; background:var(--orange); margin:12px 0 26px; }
  section { background:var(--panel); border:1px solid var(--grey); border-radius:14px; padding:20px 22px; margin-bottom:20px; }
  h2 { margin:0 0 4px; font-size:17px; color:#fff; }
  .note { color:var(--dim); font-size:13px; margin:0 0 14px; }
  .choices { display:flex; flex-wrap:wrap; gap:10px; }
  .choices label { cursor:pointer; }
  .choices input { position:absolute; opacity:0; pointer-events:none; }
  .choices span { display:inline-block; padding:10px 18px; border-radius:10px; border:2px solid var(--grey); background:#111; font-size:15px; }
  .choices input:checked + span { border-color:var(--orange); background:var(--orange-soft, #2a1a08); color:#fff; font-weight:700; }
  .choices input:focus-visible + span { outline:2px solid #fff; }
  .pics { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:14px; }
  .pics label { cursor:pointer; display:block; }
  .pics input { position:absolute; opacity:0; pointer-events:none; }
  .pic { border:3px solid transparent; border-radius:12px; overflow:hidden; background:#111; }
  .pic .img { aspect-ratio:16/9; background-size:cover; background-position:center; }
  .pic .img.mix { display:grid; grid-template-columns:1fr 1fr 1fr; grid-template-rows:1fr 1fr; }
  .pic .img.mix div { background-size:cover; background-position:center; }
  .pic .name { padding:8px 10px; font-size:14px; }
  .pics input:checked + .pic { border-color:var(--orange); }
  .pics input:checked + .pic .name { color:#fff; font-weight:700; }
  .pics input:focus-visible + .pic { outline:2px solid #fff; }
  .actions { display:flex; gap:12px; flex-wrap:wrap; align-items:center; }
  button, a.btn { font:inherit; font-size:15px; font-weight:700; padding:12px 20px; border-radius:10px; border:0; cursor:pointer; text-decoration:none; }
  .primary { background:var(--orange); color:#000; }
  .secondary { background:var(--grey); color:#fff; }
  #saved { color:var(--orange); font-size:14px; opacity:0; transition:opacity .4s; }
  #saved.show { opacity:1; }

  .links { display:grid; grid-template-columns:repeat(auto-fill, minmax(260px, 1fr)); gap:10px; }
  .link { display:flex; align-items:center; gap:12px; background:#111; border:1px solid var(--grey); border-radius:10px; padding:10px 12px; }
  .link .ic { width:30px; height:30px; border-radius:50%; background:var(--orange); color:#000; font-weight:800; display:grid; place-items:center; flex:none; }
  .link .tx { flex:1; min-width:0; }
  .link .nm { color:#fff; font-weight:700; font-size:15px; }
  .link .ad { color:var(--dim); font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .link .lock { color:var(--dim); font-size:12px; }
  .link button { padding:6px 12px; font-size:13px; }
  form { display:grid; grid-template-columns:1fr 1.4fr auto; gap:10px; align-items:end; }
  @media (max-width:700px) { form { grid-template-columns:1fr; } }
  label.field { font-size:13px; color:var(--dim); display:grid; gap:4px; }
  input[type=text] { font:inherit; font-size:15px; padding:11px 12px; border-radius:8px; border:1px solid var(--grey); background:#0f0f0f; color:#fff; outline:none; }
  input:focus { border-color:var(--orange); }
  #msg { font-size:14px; min-height:18px; margin-top:8px; }
  #msg.bad { color:#e0483e; } #msg.good { color:var(--orange); }
</style>
</head>
<body>
<main>
  <h1>Link tabs <span>EAGLE-OS</span></h1>
  <div class="rule"></div>
  <section>
    <h2>Your tabs</h2>
    <p class="note">These sites open as tabs after the EAGLE tab, in A–Z order. Each one loads when you click its tab. Google, Gmail, YouTube, Maps, News and Weather are always there.</p>
    <div class="links" id="list"></div>
  </section>
  <section>
    <h2>Add a site</h2>
    <form id="add">
      <label class="field">Name<input type="text" id="name" maxlength="24" placeholder="Facebook" required></label>
      <label class="field">Web address<input type="text" id="url" placeholder="facebook.com" required></label>
      <button type="submit" class="primary" id="add-btn">Add tab</button>
    </form>
    <div id="msg"></div>
  </section>
  <div class="actions"><a class="btn secondary" href="start.html">Back to the EAGLE tab</a></div>
</main>
<script src="shim.js"></script>
<script src="activity.js"></script>
<script src="theme.js"></script>
<script src="links-data.js"></script>
<script src="links.js"></script>
</body>
</html>
