<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon-64.png">
<title>EAGLE-OS screensaver</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none;
    font-family:"Noto Sans","DejaVu Sans",sans-serif; color:#fff; }
  .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0;
    transition: opacity 2.5s ease-in-out; will-change: opacity, transform; }
  .slide.show { opacity:1; }
  html.motion .slide.show { animation: drift 24s ease-out forwards; }
  @keyframes drift { from { transform: scale(1.0) translate(0,0); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
  .info { position:absolute; left:56px; bottom:48px; text-shadow:0 2px 18px rgba(0,0,0,.65); }
  #time { font-size:96px; font-weight:300; letter-spacing:.02em; line-height:1; }
  #date { font-size:26px; margin-top:10px; opacity:.92; }
  .bar { width:90px; height:4px; background:var(--orange, #ff7a00); margin-top:14px; border-radius:2px; }
  .logo { position:absolute; right:48px; bottom:44px; width:220px; opacity:.55; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }
  .hint { position:absolute; top:24px; left:0; right:0; text-align:center; font-size:15px; opacity:0;
    transition: opacity 1s; text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .hint.show { opacity:.85; }
  .lock { position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); cursor:default; }
  .lock.show { display:grid; }
  .lock form { background:rgba(17,17,17,.92); border:2px solid var(--orange, #ff7a00); border-radius:16px; padding:26px 30px;
    width:340px; text-align:center; box-shadow:0 12px 40px rgba(0,0,0,.6); }
  .lock h2 { margin:0 0 4px; font-size:22px; } .lock p { margin:0 0 16px; color:#bbb; font-size:14px; }
  .lock input { width:100%; box-sizing:border-box; font:inherit; font-size:22px; letter-spacing:.3em; text-align:center;
    padding:10px; border-radius:10px; border:1px solid #444; background:#000; color:#fff; outline:none; }
  .lock input:focus { border-color:var(--orange, #ff7a00); }
  .lock .row { display:flex; gap:10px; margin-top:14px; }
  .lock button { flex:1; font:inherit; font-weight:700; font-size:15px; padding:11px; border-radius:10px; border:0; cursor:pointer; }
  .lock .go { background:var(--orange, #ff7a00); color:#000; } .lock .sw { background:#333; color:#fff; }
  .lock .err { color:#ff6b5e; min-height:18px; margin-top:10px; font-size:14px; }
</style>
</head>
<body>
  <div class="slide" id="a"></div>
  <div class="slide" id="b"></div>
  <div class="info"><div id="time"></div><div id="date"></div><div class="bar"></div></div>
  <img class="logo" src="logo.png" alt="">
  <div class="hint" id="hint">Move the mouse or press any key to return</div>
  <div class="lock" id="lock"><form id="lockform" autocomplete="off">
    <h2 id="lockname">Locked</h2><p>Type your PIN to unlock</p>
    <input type="password" id="pin" inputmode="numeric" maxlength="32" aria-label="PIN">
    <div class="err" id="lockerr"></div>
    <div class="row"><button type="submit" class="go">Unlock</button><button type="button" class="sw" id="switch">Switch person</button></div>
  </form></div>
  <script src="shim.js"></script>
  <script src="theme.js"></script>
  <script src="screensaver.js"></script>
</body>
</html>
