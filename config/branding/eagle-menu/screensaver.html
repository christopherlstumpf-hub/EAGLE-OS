<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EAGLE-OS screensaver</title>
<style>
  html,body { margin:0; height:100%; background:#000; overflow:hidden; cursor:none;
    font-family:"Noto Sans","DejaVu Sans",sans-serif; color:#fff; }
  .slide { position:absolute; inset:0; background-size:cover; background-position:center; opacity:0;
    transition: opacity 2.5s ease-in-out; will-change: opacity, transform; }
  .slide.show { opacity:1; }
  html.motion .slide.show { animation: drift 24s ease-out forwards; }
  @keyframes drift { from { transform: scale(1.0) translate(0,0); } to { transform: scale(1.08) translate(-1.5%, -1%); } }
  .info { position:absolute; left:56px; bottom:48px; text-shadow:0 2px 18px rgba(0,0,0,.65); }
  #time { font-size:96px; font-weight:300; letter-spacing:.02em; line-height:1; }
  #date { font-size:26px; margin-top:10px; opacity:.92; }
  .bar { width:90px; height:4px; background:#ff7a00; margin-top:14px; border-radius:2px; }
  .logo { position:absolute; right:48px; bottom:44px; width:220px; opacity:.55; filter: drop-shadow(0 2px 10px rgba(0,0,0,.6)); }
  .hint { position:absolute; top:24px; left:0; right:0; text-align:center; font-size:15px; opacity:0;
    transition: opacity 1s; text-shadow:0 1px 8px rgba(0,0,0,.8); }
  .hint.show { opacity:.85; }
</style>
</head>
<body>
  <div class="slide" id="a"></div>
  <div class="slide" id="b"></div>
  <div class="info"><div id="time"></div><div id="date"></div><div class="bar"></div></div>
  <img class="logo" src="logo.png" alt="">
  <div class="hint" id="hint">Move the mouse or press any key to return</div>
  <script src="screensaver.js"></script>
</body>
</html>
