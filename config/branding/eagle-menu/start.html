<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="icon" href="icon-64.png">
<title>EAGLE-OS</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --black:#000; --panel:#1b1b1b; --panel2:#151515; --grey:#3a3a3a; --text:#d6d6d6; --dim:#8a8a8a; --orange:#ff7a00; --red:#e0483e; --green:#7fb069; }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; overflow:hidden; background:var(--black); color:var(--text);
    font-family:"Noto Sans", "DejaVu Sans", sans-serif; }
  body { display:grid; grid-template-columns:1fr; height:100vh; }
  @media (min-width:900px) { body { grid-template-columns:1fr 320px; } }
  @media (max-width:899px) { aside { display:none !important; } }

  /* ---- main: logo, analog clock, notifications ---- */
  main { min-height:0; overflow:hidden; display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:18px; padding:16px 24px 40px; }
  .logo { width:min(340px, 50vw); max-height:11vh; object-fit:contain; }
  .bar { width:min(220px, 34vw); height:4px; background:var(--orange); margin-top:-10px; }
  .row { display:flex; gap:28px; align-items:stretch; justify-content:center; width:100%; max-width:960px; min-height:0; flex:0 1 auto; }
  .clock-card { display:flex; flex-direction:column; align-items:center; gap:10px; flex:none; }
  #analog { width:min(260px, 38vh); height:min(260px, 38vh); }
  #analog .face { fill:var(--panel); stroke:var(--grey); stroke-width:2; }
  #analog .tick { stroke:#6a6a6a; stroke-width:2; stroke-linecap:round; }
  #analog .tick.big { stroke:var(--text); stroke-width:4; }
  #analog .hour { stroke:#f2f2f2; stroke-width:8; stroke-linecap:round; }
  #analog .min { stroke:#f2f2f2; stroke-width:5; stroke-linecap:round; }
  #analog .sec { stroke:var(--orange); stroke-width:2; stroke-linecap:round; }
  #analog .hub { fill:var(--orange); }
  #analog .num { fill:var(--dim); font-size:15px; font-weight:700; text-anchor:middle; dominant-baseline:central; }
  #date { color:var(--text); font-size:16px; letter-spacing:.04em; text-align:center; }
  #date b { color:#fff; font-size:22px; display:block; letter-spacing:.02em; }
  .battery { display:flex; align-items:center; gap:8px; color:var(--dim); font-size:14px; margin-top:-8px; }
  .battery.hidden { display:none; }
  .batt-icon { position:relative; width:30px; height:14px; border:2px solid var(--dim); border-radius:3px; box-sizing:border-box; }
  .batt-icon::after { content:""; position:absolute; right:-5px; top:3px; width:3px; height:4px; background:var(--dim); border-radius:0 1px 1px 0; }
  .batt-fill { position:absolute; left:1px; top:1px; bottom:1px; border-radius:1px; background:var(--text); }
  .battery.low { color:var(--red); } .battery.low .batt-icon { border-color:var(--red); } .battery.low .batt-fill { background:var(--red); }
  .battery.charging .batt-fill { background:var(--green); }
  .batt-bolt { color:var(--green); font-weight:800; }
  .battery { justify-content:center; }

  .status-row { display:flex; gap:18px; align-items:center; justify-content:center; flex-wrap:wrap; }
  .status-row .battery { margin-top:0; }
  .wifi { display:flex; align-items:center; gap:8px; background:transparent; border:0; padding:4px 8px; border-radius:8px;
    color:var(--dim); font:inherit; font-size:14px; cursor:pointer; }
  .wifi:hover, .wifi:focus { background:#1b1b1b; color:var(--text); outline:none; }
  .wifi svg { width:20px; height:16px; flex:none; }
  .wifi .b { fill:#3a3a3a; }
  .wifi .b.on { fill:var(--text); }
  .wifi.good .b.on { fill:var(--green); }
  .wifi.warn .b.on { fill:#e8b33a; }
  .wifi.off { color:var(--red); }
  .wifi.off .b { fill:#552222; }
  .wifi .name { max-width:150px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; color:var(--text); }
  .notes { flex:1 1 380px; max-width:440px; min-width:280px; background:var(--panel); border:1px solid var(--grey); border-radius:14px;
    display:flex; flex-direction:column; min-height:0; max-height:min(420px, 56vh); }
  .notes-head { display:flex; align-items:center; justify-content:space-between; padding:14px 16px 10px; border-bottom:1px solid #2a2a2a; }
  .notes-head h2 { margin:0; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700; }
  .notes-head .count { background:var(--orange); color:#000; font-weight:800; font-size:12px; border-radius:10px; padding:1px 8px; margin-left:8px; }
  .notes-head a { color:var(--orange); font-size:12px; text-decoration:none; cursor:pointer; }
  .notes-list { overflow-y:auto; padding:6px 8px 8px; min-height:0; }
  .note { display:flex; gap:12px; align-items:flex-start; padding:10px 8px; border-radius:10px; cursor:pointer; position:relative; }
  .note:hover, .note:focus { background:#232323; outline:none; }
  .note .ic { width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:17px; background:#2a2a2a; }
  .note.alert .ic { background:#3a1512; }
  .note .tx { flex:1; min-width:0; }
  .note .tt { color:#fff; font-weight:700; font-size:14px; }
  .note .bd { color:var(--text); font-size:13px; margin-top:2px; overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .note .tm { color:var(--dim); font-size:11px; margin-top:3px; }
  .note .x { border:0; background:transparent; color:#777; font-size:15px; cursor:pointer; padding:2px 6px; border-radius:6px; }
  .note .x:hover { color:#fff; background:#333; }
  .note.alert .tt { color:#ff8a80; }
  .empty { color:var(--dim); font-size:14px; text-align:center; padding:28px 12px; }
  .empty b { display:block; color:var(--text); font-size:15px; margin-bottom:4px; }
  @media (max-width:760px) { .row { flex-direction:column; align-items:center; } .notes { width:100%; } }

  /* ---- right column: calendar ---- */
  aside { display:flex; flex-direction:column; gap:18px; padding:28px 22px; background:var(--panel2);
    border-left:1px solid #222; }
  @media (max-width:1099px) { aside { border-left:0; border-top:1px solid #222; align-items:center; } aside > section { width:min(420px, 92vw); } }
  .card { background:var(--panel); border:1px solid var(--grey); border-radius:12px; padding:16px; }
  .card h2 { margin:0; font-size:13px; letter-spacing:.12em; text-transform:uppercase; color:var(--dim); font-weight:700; }

  .cal-head { display:flex; align-items:center; justify-content:space-between; margin:6px 0 12px; }
  .cal-title { font-size:18px; font-weight:700; color:#fff; }
  .cal-nav { display:flex; gap:6px; }
  .cal-nav button { border-radius:8px; padding:4px 10px; font-size:16px; background:var(--grey); color:#fff; }
  .cal-nav button:hover, .cal-nav button:focus { background:var(--orange); color:#000; outline:none; }
  .cal-grid { display:grid; grid-template-columns:repeat(7, 1fr); gap:4px; text-align:center; }
  .cal-grid .dow { font-size:11px; color:var(--dim); padding-bottom:4px; letter-spacing:.06em; }
  .cal-grid .day { font-size:14px; line-height:34px; border-radius:50%; color:var(--text); }
  .cal-grid .day.other { color:#555; }
  .cal-grid .day.weekend { color:#a8a8a8; }
  .cal-grid .day.today { background:var(--orange); color:#000; font-weight:800; }
  .cal-grid .day { position:relative; cursor:pointer; }
  .cal-grid .day:hover { box-shadow:inset 0 0 0 1px var(--grey); }
  .cal-grid .day.sel { box-shadow:inset 0 0 0 2px var(--orange); }
  .cal-grid .dots { position:absolute; left:0; right:0; bottom:2px; display:flex; justify-content:center; gap:2px; pointer-events:none; }
  .cal-grid .dots i { width:5px; height:5px; border-radius:50%; }
  .cal-grid .day.today .dots i { box-shadow:0 0 0 1px #000; }
  .cal-events { margin-top:12px; border-top:1px solid var(--grey); padding-top:10px; }
  .cal-events h3 { margin:0 0 6px; font-size:12px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase; font-weight:600; }
  .ev { display:flex; gap:8px; align-items:flex-start; font-size:13px; padding:4px 0; }
  .ev .evbar { width:4px; align-self:stretch; border-radius:2px; flex:none; }
  .ev .t { color:var(--dim); white-space:nowrap; flex:none; width:88px; }
  .ev .n { color:var(--text); overflow:hidden; text-overflow:ellipsis; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; }
  .ev-none { font-size:13px; color:var(--dim); padding:2px 0 4px; }
  .cal-connect { font-size:13px; color:var(--orange); text-decoration:none; }
  .cal-foot { display:flex; justify-content:space-between; align-items:center; margin-top:10px; font-size:12px; color:var(--dim); }
  .cal-foot a { color:var(--orange); text-decoration:none; cursor:pointer; }


  aside { min-height:0; overflow:hidden; padding:18px 18px; }
  aside .card { display:flex; flex-direction:column; min-height:0; }
  .cal-grid .day { line-height:30px; }
  .cal-events { min-height:0; overflow:hidden; }

  .version { position:fixed; right:14px; bottom:10px; font-size:12px; color:var(--dim); letter-spacing:.04em; pointer-events:none; z-index:5; }
  .version[hidden] { display:none; }
  .maker { position:fixed; left:0; right:0; bottom:10px; text-align:center; font-size:13px; color:var(--dim); letter-spacing:.08em; pointer-events:none; }
  @media (min-width:900px) { .maker { right:320px; } }
</style>
</head>
<body>
<main>
  <img data-tint class="logo" src="logo.png" alt="EAGLE-OS">
  <div class="bar"></div>
  <div class="row">
    <section class="clock-card" aria-label="Clock">
      <svg id="analog" viewBox="0 0 200 200" role="img" aria-label="Clock"></svg>
      <div id="date"></div>
      <div class="status-row">
        <button type="button" id="wifi" class="wifi" data-eagle-action="wifi" title="Wi-Fi and network" hidden></button>
        <div id="battery" class="battery hidden" role="status"></div>
      </div>
    </section>
    <section class="notes" aria-label="Notifications">
      <div class="notes-head"><h2>Notifications<span class="count" id="note-count" hidden></span></h2><a id="clear-all" role="button" tabindex="0" hidden>Clear all</a></div>
      <div class="notes-list" id="notes" aria-live="polite"></div>
    </section>
  </div>
</main>

<aside>
  <section class="card" aria-label="Calendar">
    <h2>Calendar</h2>
    <div class="cal-head">
      <div class="cal-title" id="cal-title"></div>
      <div class="cal-nav">
        <button type="button" id="cal-prev" aria-label="Previous month">‹</button>
        <button type="button" id="cal-next" aria-label="Next month">›</button>
      </div>
    </div>
    <div class="cal-grid" id="cal-grid"></div>
    <div class="cal-events" id="cal-events"></div>
    <div class="cal-foot"><a href="#" data-eagle-action="datetime">Set date and time</a><a href="calendars.html" target="_blank">Calendars</a><a id="cal-today" role="button" tabindex="0">Today</a></div>
  </section>
</aside>
<div class="maker">by Stumpf Technology</div>
<div id="version" class="version" hidden></div>
<script src="shim.js"></script>
<script src="theme.js"></script>
<script src="activity.js"></script>
<script src="start-page.js"></script>
</body>
</html>
