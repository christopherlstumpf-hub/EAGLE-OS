# EAGLE-OS settings — edit before building (or on the installed machine).

# Page Firefox opens at startup (the EAGLE start page by default)
HOME_URL="file:///usr/share/eagle/start.html"

# KIOSK=0  full Firefox: tabs, address bar, bookmarks
# KIOSK=1  locked single site, no browser controls (for terminals/check-in stations)
KIOSK=0
