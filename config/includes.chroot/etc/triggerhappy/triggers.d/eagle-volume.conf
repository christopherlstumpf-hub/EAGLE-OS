# EAGLE-OS volume keys (value 1 = press, 2 = held down / repeat)
KEY_VOLUMEUP    1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-volume up
KEY_VOLUMEUP    2  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-volume up
KEY_VOLUMEDOWN  1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-volume down
KEY_VOLUMEDOWN  2  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-volume down
KEY_MUTE        1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-volume mute
# Screen brightness keys (Macs; other PCs change brightness in their firmware)
KEY_BRIGHTNESSUP    1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-brightness up
KEY_BRIGHTNESSUP    2  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-brightness up
KEY_BRIGHTNESSDOWN  1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-brightness down
KEY_BRIGHTNESSDOWN  2  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-brightness down
# MacBook function keys (F3–F9; F1/F2 brightness and F10–F12 sound are above)
KEY_SCALE           1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-key start
KEY_DASHBOARD       1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-key menu
KEY_KBDILLUMUP      1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-kbdlight up
KEY_KBDILLUMUP      2  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-kbdlight up
KEY_KBDILLUMDOWN    1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-kbdlight down
KEY_KBDILLUMDOWN    2  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-kbdlight down
KEY_PLAYPAUSE       1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-media play-pause
KEY_NEXTSONG        1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-media next
KEY_PREVIOUSSONG    1  /usr/local/bin/eagle-asuser /usr/local/bin/eagle-media previous
