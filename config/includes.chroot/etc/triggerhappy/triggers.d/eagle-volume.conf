# EAGLE-OS volume keys (value 1 = press, 2 = held down / repeat)
KEY_VOLUMEUP    1  /usr/local/bin/eagle-volume up
KEY_VOLUMEUP    2  /usr/local/bin/eagle-volume up
KEY_VOLUMEDOWN  1  /usr/local/bin/eagle-volume down
KEY_VOLUMEDOWN  2  /usr/local/bin/eagle-volume down
KEY_MUTE        1  /usr/local/bin/eagle-volume mute
# Screen brightness keys (Macs; other PCs change brightness in their firmware)
KEY_BRIGHTNESSUP    1  /usr/local/bin/eagle-brightness up
KEY_BRIGHTNESSUP    2  /usr/local/bin/eagle-brightness up
KEY_BRIGHTNESSDOWN  1  /usr/local/bin/eagle-brightness down
KEY_BRIGHTNESSDOWN  2  /usr/local/bin/eagle-brightness down
