# EAGLE-OS Mac support
# Broadcom Wi-Fi: let "wl" drive these chips (same list as Debian's broadcom-sta, minus b44 Ethernet).
# Newer Broadcom chips (brcmfmac) are not affected.
blacklist b43
blacklist b43legacy
blacklist ssb
blacklist bcma
blacklist brcmsmac
# FaceTime HD camera: this unrelated Broadcom driver can grab the camera first
blacklist bdc_pci
