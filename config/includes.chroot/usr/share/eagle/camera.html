<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>EAGLE-OS · Camera test</title>
<style>
  :root { --panel:#1b1b1b; --grey:#3a3a3a; --text:#d6d6d6; --dim:#8a8a8a; --orange:#ff7a00; }
  html,body { margin:0; min-height:100%; background:#000; color:var(--text); font-family:"Noto Sans","DejaVu Sans",sans-serif; }
  main { max-width:900px; margin:0 auto; padding:32px 20px; display:flex; flex-direction:column; gap:18px; align-items:center; }
  h1 { margin:0; font-size:22px; letter-spacing:.04em; color:#eee; }
  h1 span { color:var(--orange); }
  .bar { width:160px; height:3px; background:var(--orange); }
  video { width:100%; max-width:820px; aspect-ratio:16/9; background:var(--panel); border:2px solid var(--grey); border-radius:12px; transform:scaleX(-1); object-fit:cover; }
  .row { display:flex; gap:12px; flex-wrap:wrap; justify-content:center; align-items:center; }
  select, button { font:inherit; font-size:15px; padding:10px 14px; border-radius:8px; border:1px solid var(--grey); background:var(--panel); color:var(--text); }
  button.go { background:var(--orange); color:#000; border:0; font-weight:700; cursor:pointer; }
  .meter { width:260px; height:10px; background:var(--panel); border:1px solid var(--grey); border-radius:6px; overflow:hidden; }
  .meter div { height:100%; width:0; background:var(--orange); transition:width .08s; }
  #status { color:var(--dim); text-align:center; max-width:640px; }
  a { color:var(--orange); }
</style>
</head>
<body>
<main>
  <h1>Camera <span>test</span></h1>
  <div class="bar"></div>
  <video id="video" autoplay playsinline muted></video>
  <div class="row">
    <select id="cams" aria-label="Camera"></select>
    <button class="go" id="start">Turn on camera</button>
  </div>
  <div class="row"><span>Microphone</span><div class="meter"><div id="level"></div></div></div>
  <div id="status">Press <b>Turn on camera</b>, then choose <b>Allow</b> when Firefox asks.</div>
  <a href="start.html">← Back to the start page</a>
</main>
<script>
  const video = document.getElementById("video"), cams = document.getElementById("cams"),
        status = document.getElementById("status"), level = document.getElementById("level");
  let stream, audioCtx;

  async function listCameras() {
    const devices = await navigator.mediaDevices.enumerateDevices();
    const list = devices.filter(d => d.kind === "videoinput");
    cams.innerHTML = "";
    list.forEach((d, i) => cams.add(new Option(d.label || `Camera ${i + 1}`, d.deviceId)));
    return list.length;
  }

  async function start() {
    try {
      if (stream) stream.getTracks().forEach(t => t.stop());
      const id = cams.value;
      stream = await navigator.mediaDevices.getUserMedia({
        video: id ? { deviceId: { exact: id } } : true, audio: true });
      video.srcObject = stream;
      const n = await listCameras();
      const track = stream.getVideoTracks()[0];
      if (track) cams.value = track.getSettings().deviceId || cams.value;
      const s = track ? track.getSettings() : {};
      status.textContent = `Camera working: ${track ? track.label : "?"} (${s.width || "?"}×${s.height || "?"}). ${n > 1 ? "Pick another camera above to switch." : ""}`;
      meter();
    } catch (e) {
      const msg = { NotFoundError: "No camera was found. Plug in a USB webcam and try again.",
                    NotAllowedError: "Camera access was blocked. Press the camera icon in the address bar to allow it.",
                    NotReadableError: "The camera is busy or not supported. Unplug it, plug it back in and try again." }[e.name];
      status.textContent = msg || `Camera problem: ${e.message}`;
    }
  }

  function meter() {
    if (!stream.getAudioTracks().length) return;
    if (audioCtx) audioCtx.close();
    audioCtx = new AudioContext();
    const an = audioCtx.createAnalyser(); an.fftSize = 512;
    audioCtx.createMediaStreamSource(stream).connect(an);
    const buf = new Uint8Array(an.fftSize);
    (function tick() {
      an.getByteTimeDomainData(buf);
      let peak = 0; for (const v of buf) peak = Math.max(peak, Math.abs(v - 128));
      level.style.width = Math.min(100, peak * 1.6) + "%";
      requestAnimationFrame(tick);
    })();
  }

  document.getElementById("start").onclick = start;
  cams.onchange = start;
  listCameras();
</script>
</body>
</html>
