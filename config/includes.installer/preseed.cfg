# Hands-off install for EAGLE.
# The only question left on purpose: which drive to erase.

# Language, keyboard, clock
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i clock-setup/utc boolean true
d-i time/zone string America/New_York
d-i clock-setup/ntp boolean false

# No network needed to install: everything is on the USB stick.
# (Wi-Fi is set up on first boot by the Wi-Fi picker.)
d-i netcfg/enable boolean false
d-i netcfg/get_hostname string eagle
d-i netcfg/get_domain string
d-i hw-detect/load_firmware boolean false
d-i apt-setup/use_mirror boolean false
d-i apt-setup/cdrom/set-first boolean false
d-i apt-setup/non-free-firmware boolean true
d-i apt-setup/non-free boolean true
d-i apt-setup/contrib boolean true

# Accounts: no admin login at all; the browser runs as the built-in "kiosk" user.
d-i passwd/make-user boolean false
d-i passwd/root-login boolean true
d-i passwd/root-password-crypted password !

# Disk: erase the chosen drive and use all of it.
# Drive selection is still asked, so the wrong disk is never wiped silently.
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-lvm/device_remove_lvm boolean true
d-i partman-md/device_remove_md boolean true
d-i partman-efi/non_efi_system boolean true
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# Bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/with_other_os boolean false
d-i grub-installer/bootdev string default

# Point the installed system at Debian's servers so it can update itself.
# Also: show the EAGLE-OS splash at every start, and skip the boot menu.
d-i preseed/late_command string \
  printf 'deb http://deb.debian.org/debian trixie main contrib non-free non-free-firmware\ndeb http://deb.debian.org/debian trixie-updates main contrib non-free non-free-firmware\ndeb http://security.debian.org/debian-security trixie-security main contrib non-free non-free-firmware\n' > /target/etc/apt/sources.list; \
  sed -i -e 's/^GRUB_CMDLINE_LINUX_DEFAULT=.*/GRUB_CMDLINE_LINUX_DEFAULT="quiet splash loglevel=3 vt.global_cursor_default=0"/' -e 's/^GRUB_TIMEOUT=.*/GRUB_TIMEOUT=0/' /target/etc/default/grub; \
  echo 'GRUB_TIMEOUT_STYLE=hidden' >> /target/etc/default/grub; \
  in-target update-grub

# Finish: eject and reboot without asking
d-i cdrom-detect/eject boolean true
d-i finish-install/reboot_in_progress note
