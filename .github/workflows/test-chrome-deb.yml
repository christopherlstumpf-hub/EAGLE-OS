# Test helper: fetches the current Google Chrome .deb so EAGLE's Chrome install can be tested in a
# virtual PC without internet. Put in a private DRAFT release (only repo owners can see it),
# deleted again after testing; never published.
name: Test Chrome download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsSL -o chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
          dpkg-deb -f chrome.deb Version Depends Recommends
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete chrome-test-private --yes --cleanup-tag -R "$GITHUB_REPOSITORY" 2>/dev/null || true
          gh release create chrome-test-private chrome.deb --draft --title "Chrome test file (private draft, delete after testing)" --notes "Private test file. Do not publish." -R "$GITHUB_REPOSITORY"
