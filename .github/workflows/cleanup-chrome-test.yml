# Removes the private Chrome test file (draft release) made by "Test Chrome download".
name: Remove Chrome test file
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [".github/workflows/cleanup-chrome-test.yml"]
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete chrome-test-private --yes --cleanup-tag -R "$GITHUB_REPOSITORY" || true
